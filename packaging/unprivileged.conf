# Drop-in installed by `install.sh --unprivileged`: run as a dedicated user
# without any capabilities. Guest, storage and cluster metrics come from the
# Proxmox API with a read-only (PVEAuditor) token; SMART, IPMI and container
# metrics are not available in this mode.
[Service]
User=proxmox-exporter
Group=proxmox-exporter
CapabilityBoundingSet=
AmbientCapabilities=
ProtectSystem=strict
